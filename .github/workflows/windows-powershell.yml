name: Windows PowerShell 5.1 reliability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install demo-art test dependencies
        shell: powershell
        run: python -m pip install -r tools/requirements.txt

      - name: Run portable reliability tests
        shell: powershell
        run: node --test tests/reliability.test.mjs

      - name: Run Windows PowerShell 5.1 lifecycle selftest
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tests\windows-powershell-selftest.ps1"
